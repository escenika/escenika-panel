<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#100C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escenika">
<meta name="robots" content="noindex">
<title>Escenika · Panel</title>
<link rel="icon" type="image/png" href="/marca/favicon-64.png">
<link rel="apple-touch-icon" href="/marca/apple-touch-icon.png">
<link rel="manifest" href="/marca/manifest.webmanifest">
<!--
  🎭 PÁGINA DE ENTRADA AL PANEL DE ESCENIKA (panel.escenikamicroteatro.com)
  ─────────────────────────────────────────────────────────────────────────
  Este archivo NO va en Apps Script: se sube a tu dominio (GitHub Pages, tu hosting…)
  con el nombre index.html. Ver la guía «Entrar con Google» para los pasos.

  Rellena estos dos datos:
-->
<script>
  var ESCENIKA_CONFIG = {
    // 1) ID de cliente de Google (el mismo que pones en Panel.gs › PANEL_LOGIN.clientId)
    clientId: "1063602030977-d30hja5ni046v0qe57r0rvn67d30l5ri.apps.googleusercontent.com",
    // 2) URL de la Web App de Apps Script (Implementar › Gestionar implementaciones › la URL que acaba en /exec)
    api: "https://script.google.com/macros/s/AKfycbxpz_qancQQRnDQd6huykOIWCXt_Sh3z1QjiHPwd335pq5sfDtmAfNEv7g-jyXCLMwpuw/exec"
  };
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.__eskIniciar && window.__eskIniciar()"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1d1d1f;background:#100C0A}
  .fondo{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
         background:radial-gradient(circle at 85% 10%,rgba(200,16,46,.45),transparent 45%),radial-gradient(circle at 10% 90%,rgba(226,118,0,.25),transparent 40%),#100C0A}
  .tarjeta{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:30px 24px 24px;box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center}
  .tarjeta{position:relative;overflow:hidden}
  .tarjeta:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#100C0A 0 62%,#E50000 62%)}
  .logo{display:block;width:100%;max-width:330px;height:auto;margin:4px auto 0}
  .logo-txt{font-weight:800;font-size:38px;letter-spacing:.5px;color:#100C0A;line-height:1} .logo-txt b{color:#E50000}
  .elenco{background:#f6f3f0;border-radius:12px;padding:10px 12px;font-size:13px;color:#444;margin-top:16px;text-align:left}
  h1{font-size:19px;margin:26px 0 6px}
  p{color:#555;font-size:14px;margin:0 0 18px}
  #boton{display:flex;justify-content:center;min-height:44px}
  .estado{margin-top:16px;font-size:14px;color:#555;min-height:20px}
  .estado.error{color:#a3201d}
  .aviso{background:#fff6d6;color:#7a5d00;border-radius:12px;padding:12px;font-size:14px;margin-top:16px;text-align:left}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
  .btn.p{background:#100C0A;color:#fff} .btn.s{background:#eef0f4;color:#1d1d1f}
  .pie{color:#9a9da6;font-size:12px;margin-top:22px}
  .giro{display:inline-block;width:18px;height:18px;border:3px solid #e3e5ea;border-top-color:#C8102E;border-radius:50%;animation:g 1s linear infinite;vertical-align:-4px;margin-right:6px}
  @keyframes g{to{transform:rotate(360deg)}}
  .oculto{display:none}
</style>
</head>
<body>
<div class="fondo" id="pantalla">
  <div class="tarjeta">
    <img class="logo" src="/marca/escenika-lema.jpg" alt="escenika · Historias que importan · Garrantzia duten istorioak"
         onerror="this.outerHTML='&lt;div class=&quot;logo-txt&quot;&gt;escen&lt;b&gt;ika&lt;/b&gt;&lt;/div&gt;'">
    <div id="caja">
      <h1>Entra en Escenika</h1>
      <p>Con tu cuenta de Google.</p>
      <div id="boton"></div>
      <div class="estado" id="estado"><span class="giro"></span>Cargando…</div>
      <div class="elenco">🎭 <b>¿Eres del elenco?</b> Entra con el correo que pusiste en tu ficha de participante y verás <b>Mi Escenika</b>: tus ensayos, las funciones, los mensajes y los avisos.</div>
    </div>
    <div class="pie">🔒 Tu sesión es privada · escenikamicroteatro.com</div>
  </div>
</div>

<script>
/* Todo va dentro de una función: las páginas de Apps Script que se muestran después
   comparten la misma ventana y no deben chocar con nombres de aquí. */
(function () {
const CLIENT_ID = ESCENIKA_CONFIG.clientId, API_URL = ESCENIKA_CONFIG.api;
const $ = id => document.getElementById(id);
let credencial = null, sesionGoogle = false;

function post(datos) {
  return fetch(API_URL, {
    method: "POST", redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },   // sin «preflight»: Apps Script no lo admite
    body: JSON.stringify(datos)
  }).then(r => r.text().then(t => ({ st: r.status, t: t })), e => { console.error("Escenika · fetch:", e); throw new Error(SIN_CONEXION + " (sin respuesta del servidor)"); })
    .then(x => {
      try { return JSON.parse(x.t); }
      catch (e) {
        console.error("Escenika · respuesta no válida", x.st, x.t.slice(0, 500));
        const pista = (x.t.match(/<title>([^<]*)<\/title>/i) || [])[1] || x.t.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 140);
        throw new Error(SIN_CONEXION + " (respuesta " + x.st + (pista ? ": " + pista : "") + ")");
      }
    });
}
// Si Google no deja hablar con el panel (sin conexión, o una versión nueva sin autorizar), se explica así:
const SIN_CONEXION = "No se ha podido conectar con el panel. Comprueba tu conexión y vuelve a intentarlo. " +
  "Si sigue pasando, avisa a administración: puede que la versión nueva del panel necesite que se autoricen sus permisos en el editor de Apps Script.";
try { localStorage.removeItem("escenika_logo"); } catch (e) {}
function estado(t, error) { const e = $("estado"); e.innerHTML = t; e.className = "estado" + (error ? " error" : ""); }

// Sustituto de google.script.run para las páginas de Apps Script mostradas aquí
function instalarPuente() {
  window.google = window.google || {};
  const llamar = (fn, args) => post({ tipo: "run", fn: fn, args: args }).then(r => {
    if (!r.ok) {
      if (sesionGoogle && /ya no es válido|desactivado|caducado|se ha cerrado/i.test(r.error || "") && !sessionStorage.getItem("escenika_reentrando")) {
        sessionStorage.setItem("escenika_reentrando", "1"); sessionStorage.removeItem("escenika_ses"); location.reload();   // la sesión ha caducado: se vuelve a entrar sola
      }
      throw new Error(r.error || "Error");
    }
    sessionStorage.removeItem("escenika_reentrando");
    return r.r;
  });
  const nuevo = () => {
    let ok = () => {}, ko = e => console.error(e), usuario;
    const base = {
      withSuccessHandler(f) { ok = f; return px; }, withFailureHandler(f) { ko = f; return px; }, withUserObject(u) { usuario = u; return px; }
    };
    const px = new Proxy(base, { get(t, k) {
      if (k in t) return t[k];
      return (...args) => { llamar(String(k), args).then(x => ok(x, usuario), e => ko(e, usuario)); };
    } });
    return px;
  };
  const script = { host: { close() {}, setHeight() {}, setWidth() {}, origin: location.origin } };
  Object.defineProperty(script, "run", { get: nuevo });
  window.google.script = script;
  window.__salir = salir;
}

// Muestra una página que viene de Apps Script (el panel o una página pública)
function mostrar(html, titulo) {
  instalarPuente();
  const meta = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><meta name="theme-color" content="#100C0A">' +
    '<link rel="icon" type="image/png" href="/marca/favicon-64.png"><link rel="apple-touch-icon" href="/marca/apple-touch-icon.png"><link rel="manifest" href="/marca/manifest.webmanifest">';
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + meta) : meta + html;
  document.open(); document.write(html); document.close();
  if (titulo) document.title = titulo;
}

/* ========================================================================
   Páginas públicas (calendario, ficha de participante, baja…): sin login
   ======================================================================== */
const params = Object.fromEntries(new URLSearchParams(location.search));
const esPublica = params.accion && params.accion !== "entrar";
if (esPublica) {
  $("caja").innerHTML = '<div class="estado"><span class="giro"></span>Cargando…</div>';
  post({ tipo: "pagina", p: params })
    .then(r => r.ok ? mostrar(r.html, r.titulo) : ($("caja").innerHTML = '<div class="aviso">⚠️ ' + (r.error || "No se pudo abrir la página.") + '</div>'))
    .catch(() => { $("caja").innerHTML = '<div class="aviso">⚠️ No hay conexión con el servidor. Vuelve a intentarlo.</div>'; });
}

/* ========================================================================
   Entrar con Google
   ======================================================================== */
let iniciado = false;
// Al actualizar la página: si esta pestaña ya tenía la sesión abierta, se vuelve al panel directamente (sin pasar por Google)
let reanudando = false;
(function reanudar() {
  if (esPublica) return;
  let ses = "";
  try { ses = sessionStorage.getItem("escenika_ses") || ""; } catch (e) {}
  if (!ses) return;
  reanudando = true;
  estado('<span class="giro"></span>Cargando…');
  const aGoogle = () => {
    try { sessionStorage.removeItem("escenika_ses"); } catch (e) {}
    reanudando = false;
    if (window.google && google.accounts) iniciarGoogle();   // si Google aún no ha cargado, se inicia solo al cargar
  };
  post({ tipo: "reanudar", token: ses }).then(r => { if (r.ok) { sesionGoogle = true; mostrar(r.html, "Escenika · Panel"); } else aGoogle(); }, aGoogle);
})();
function iniciarGoogle() {
  if (esPublica || iniciado || reanudando) return;
  iniciado = true;
  if (!window.google || !google.accounts) return estado("No se ha podido cargar Google. Revisa la conexión.", true);
  google.accounts.id.initialize({
    client_id: CLIENT_ID, callback: alEntrar, auto_select: !localStorage.getItem("escenika_salio"),
    cancel_on_tap_outside: false, use_fedcm_for_prompt: true, itp_support: true
  });
  google.accounts.id.renderButton($("boton"), { theme: "filled_black", size: "large", shape: "pill", text: "signin_with", locale: "es", width: 280 });
  estado("");
  if (!localStorage.getItem("escenika_salio")) google.accounts.id.prompt();
}
function alEntrar(resp) {
  credencial = resp.credential;
  localStorage.removeItem("escenika_salio");
  estado('<span class="giro"></span>Entrando…');
  post({ tipo: "entrar", idToken: credencial }).then(r => {
    if (r.ok) {
      sesionGoogle = true;
      try { if (r.token) sessionStorage.setItem("escenika_ses", r.token); } catch (e) {}   // para volver al panel al actualizar la página
      mostrar(r.html, "Escenika · Panel"); return;
    }
    if (r.sinAcceso) {
      $("caja").innerHTML = `<h1>Sin acceso todavía</h1>
        <div class="aviso">La cuenta <b>${r.correo.replace(/</g, "&lt;")}</b> no tiene acceso al panel.</div>
        <p>🎭 <b>¿Participas en Escenika?</b> Entra con la misma cuenta que pusiste en tu ficha de participante. Si aún no la has rellenado, pide el enlace a producción.</p>
        <button class="btn p" onclick="__eskPedir()">Pedir acceso a administración</button>
        <button class="btn s" onclick="__eskOtra()">Entrar con otra cuenta</button>
        <div class="estado" id="estado"></div>`;
      return;
    }
    estado("⚠️ " + (r.error || "No se ha podido entrar."), true);
  }).catch(() => estado("⚠️ No hay conexión con el servidor. Vuelve a intentarlo.", true));
}
function pedirAcceso() {
  estado('<span class="giro"></span>Enviando…');
  post({ tipo: "solicitar", idToken: credencial }).then(r => estado(r.ok ? r.mensaje : "⚠️ " + r.error, !r.ok));
}
function otraCuenta() {
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  location.reload();
}
function salir(token) {
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  localStorage.setItem("escenika_salio", "1");
  try { sessionStorage.removeItem("escenika_ses"); sessionStorage.removeItem("escenika_pos"); } catch (e) {}
  const fuera = () => { location.href = location.pathname; };
  // La sesión se cierra también en el servidor
  if (token) post({ tipo: "run", fn: "cerrarSesionPanel", args: [token] }).then(fuera, fuera); else fuera();
}

window.__eskIniciar = iniciarGoogle;
window.__eskPedir = pedirAcceso;
window.__eskOtra = otraCuenta;
if (window.google && google.accounts) iniciarGoogle();   // por si Google ya había cargado
})();
</script>
</body>
</html>
